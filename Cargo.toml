[package]
name = "tpt-replicate"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "Pure-Rust, no_std + alloc offline-first CRDT sync and merge engine: hybrid logical clocks, causal operation log, delta sync"
readme = "README.md"
keywords = ["crdt", "replication", "no_std", "hlc", "sync"]
categories = ["no-std", "data-structures", "network-programming"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Enables SystemClock, FileTransport and TcpTransport.
std = []
# Enables the WebRTC data-channel adapter against the stubbed tpt-webrtc trait.
webrtc = []
# Enables PnCounter and OrSet in the `crdt` module.
crdt = []
# Ed25519 signing and verification from tpt-crypto (see src/ed25519.rs). Needs Rust 1.84 and network
# access to GitHub when enabled. Off by default, so the core keeps no runtime dependencies.
ed25519 = ["dep:tpt-crypto-sig"]

[dependencies]
tpt-crypto-sig = { git = "https://github.com/tpt-solutions/tpt-crypto", package = "tpt-crypto-sig", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[example]]
name = "rover_dtn"
required-features = ["std"]

[[example]]
name = "tcp_chat"
required-features = ["std"]

[[bench]]
name = "merge"
harness = false

[[bench]]
name = "delta"
harness = false

[[bench]]
name = "codec"
harness = false
