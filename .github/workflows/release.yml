name: Release check

# Runs on version tags. It checks that the package would publish cleanly. It does not publish. A
# real publish is a separate, deliberate step done by a maintainer.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test before packaging
        run: cargo test --all-features
      - name: Package dry run
        run: cargo publish --dry-run
