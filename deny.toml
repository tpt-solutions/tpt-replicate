# cargo-deny policy. Run with `cargo deny check`. The scheduled workflow runs it weekly.

[advisories]
yanked = "deny"

[licenses]
# Dual MIT OR Apache-2.0 for this crate. Dependencies must use one of these.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "Unicode-DFS-2016"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/tpt-solutions/tpt-crypto", "https://github.com/tpt-solutions/tpt-version", "https://github.com/tpt-solutions/tpt-webrtc"]
